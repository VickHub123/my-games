name: Purge jsDelivr Cache

on:
  deployment_status

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Wait Github
        uses: anton-yurchenko/gh-action-http-status-check@v1
        with:
          url: 'https://githubusercontent.com'
          status-code: 200
          timeout: 60
      
      - name: Purge jsDelivr
        uses: gacts/purge-jsdelivr-cache@v1
        with:
          url: |
            https://cdn.jsdelivr.net/gh/VickHub123/my-games@main/getdatatest/insano.txt
