<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Carregando…</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #aaa; font: 16px system-ui, sans-serif; }
  body { display: grid; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<p id="msg" hidden></p>
<script>
(async () => {
  const msg = (t) => {
    const p = document.getElementById('msg');
    p.textContent = t; p.hidden = false;
    addEventListener('online', () => location.reload(), { once: true });
  };
  // Sem service worker (file:// ou http sem HTTPS): abre o site direto
  const fallback = () => location.replace('website/index.html');

  if (!('serviceWorker' in navigator) || !window.isSecureContext) return fallback();

  // Proteção contra laço de recarregamento
  const last = +sessionStorage.getItem('offline-launcher-reload') || 0;
  if (Date.now() - last < 15000) return fallback();

  try {
    await navigator.serviceWorker.register('sw.js');
    const reg = await navigator.serviceWorker.ready;

    // Sem rede: nem tenta baixar
    if (!navigator.onLine) return msg('Sem conexão. Conecte-se à internet uma vez para carregar o site.');

    const answer = await new Promise((resolve) => {
      const ch = new MessageChannel();
      ch.port1.onmessage = (e) => resolve(e.data);
      reg.active.postMessage({ type: 'sync' }, [ch.port2]);
    });

    if (answer && answer.ok) {
      sessionStorage.setItem('offline-launcher-reload', String(Date.now()));
      location.reload();          // agora o service worker entrega o site nesta mesma URL
    } else {
      msg((answer && answer.error) || 'Não foi possível carregar o site.');
    }
  } catch (e) {
    fallback();
  }
})();
</script>
</body>
</html>
